<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hillen League Dashboard</title>
<link rel="stylesheet" href="style.css?v=c064aff95a1e">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">HL</div>
    <div>
      <h1>Hillen League <span>Dashboard</span></h1>
      <p id="meta-line" class="meta-line">loading…</p>
    </div>
  </div>
  <div class="controls">
    <div class="gsearch">
      <input type="search" id="global-search" placeholder="Search players, teams, games…" autocomplete="off" aria-label="Search">
      <div id="global-results" class="global-results" role="listbox"></div>
    </div>
    <label>Season
      <select id="season-select"></select>
    </label>
    <label>Group
      <select id="group-select"></select>
    </label>
    <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle light / dark" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="standings" class="active">Standings</button>
  <button data-view="teams">Teams</button>
  <button data-view="players">Players</button>
  <button data-view="games">Games</button>
  <button data-view="leaders">Leaders</button>
  <button data-view="compare">Compare</button>
</nav>

<main id="view"></main>

<footer class="foot">Data from hillen-sports.com · SQLite · <span id="foot-counts"></span><span id="foot-fresh"></span></footer>

<script src="charts.js"></script>
<script>window.HL_BUILD="c064aff95a1e";</script>
<script src="app.js?v=c064aff95a1e"></script>
</body>
</html>
