<header class="topbar">
  <div class="brand">
    <div class="logo">HL</div>
    <div>
      <h1>Hillen League <span>Dashboard</span></h1>
      <p id="meta-line" class="meta-line">loading…</p>

  <button data-view="standings" class="active">Standings</button>
  <button data-view="teams">Teams</button>
  <button data-view="players">Players</button>
  <button data-view="games">Games</button>
  <button data-view="leaders">Leaders</button>
  <button data-view="compare">Compare</button>
</nav>

<main id="view"></main>
