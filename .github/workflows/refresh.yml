name: Scheduled data refresh

# Refresh Hillen League data from the live site, validate it, rebuild the static
# site, and publish it to GitHub Pages. Runs in GitHub's cloud, so your Mac
# doesn't need to be on.
#
# The site is published as a **Pages artifact**, not from a folder in the repo.
# docs/ is build output (~1,000 files: the inline league-data.js bundle, the
# built app and one share page per game, team, player, season and standings
# table), so it is gitignored
# and never committed — only the refreshed database, which is the data of
# record, is committed back to main.
#
# Triggers:
#   - on a schedule: weekdays 08:05 HKT, weekends every two hours or so from
#     09:05 to 23:05 HKT (cron below is UTC; comments give Hong Kong time)
#   - manually from the Actions tab ("Run workflow")
#
# Because the scheduled workflow lives in the default branch (main), any change
# to this file must be pushed to main to take effect.
#
# Requires: Settings → Pages → Source = "GitHub Actions".

on:
  schedule:
    # Match-day cadence, Hong Kong time. Hong Kong has no DST, so these UTC
    # offsets hold all year. Every slot is :05 past the hour because GitHub
    # delays top-of-the-hour crons when its queue is busy, and a 09:00 run that
    # starts at 09:40 is useless to a family leaving for the 10:00 game.
    #
    # Weekdays: one run, so a Monday-night game shows up on Tuesday morning.
    - cron: '5 0 * * 1-5'                  # Mon-Fri 08:05 HKT = 00:05 UTC
    # Weekends: seven runs across the playing day, 09:00-23:00 HKT.
    - cron: '5 1,3,5,7,10,13,15 * * 0,6'   # 09:05, 11:05, 13:05, 15:05, 18:05, 21:05, 23:05 HKT
  workflow_dispatch:

permissions:
  contents: write              # commit + push the refreshed data
  pages: write                 # publish the built site
  id-token: write              # required by actions/deploy-pages

# Never let two refreshes publish at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up git identity and branch
        run: |
          git config user.name  "Hillen League Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout main 2>/dev/null || git switch main 2>/dev/null || true

      # The published site is the React dashboard (react-dashboard/); start.sh
      # runs `server.py --export docs`, which needs Node to `vite build` it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: react-dashboard
        run: npm ci

      - name: Refresh, validate and rebuild the site
        run: ./start.sh

      # start.sh rebuilt docs/ in the step above; publish exactly that. There is
      # nothing to commit for it — docs/ is generated, not source.
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-actions
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
