name: Scheduled data refresh
run-name: ${{ inputs.scheduled_slot && format('Scheduled data refresh (fallback for {0})', inputs.scheduled_slot) || 'Scheduled data refresh' }}

# Refresh Hillen League data from the live site, validate it, rebuild the static
# site, and publish it to GitHub Pages. Runs in GitHub's cloud, so your Mac
# doesn't need to be on.
#
# The site is published as a **Pages artifact**, not from a folder in the repo.
# docs/ is build output (~1,000 files: the inline league-data.js bundle, the
# built app and one share page per game, team, player, season and standings
# table), so it is gitignored
# and never committed — only the refreshed database, which is the data of
# record, is committed back to main.
#
# Triggers:
#   - on a schedule (cron below is UTC; comments give Hong Kong time)
#   - via workflow dispatch from the Actions tab or the fallback scheduler
#
# Because the scheduled workflow lives in the default branch (main), any change
# to this file must be pushed to main to take effect.
#
# Requires: Settings → Pages → Source = "GitHub Actions".

on:
  schedule:
    # Match-day cadence, Hong Kong time. Hong Kong has no DST, so these UTC
    # offsets hold all year. Scheduling away from :00 reduces contention but
    # does not guarantee punctuality. A weekday catch-up slot provides another
    # attempt; unchanged data skips publication.
    #
    # Weekdays: morning check plus a catch-up attempt.
    - cron: '5 0 * * 1-5'                  # Mon-Fri 08:05 HKT = 00:05 UTC
    - cron: '35 2 * * 1-5'                 # Mon-Fri 10:35 HKT catch-up
    # Weekends: seven runs across the playing day, 09:00-23:00 HKT.
    - cron: '5 1,3,5,7,10,13,15 * * 0,6'   # 09:05, 11:05, 13:05, 15:05, 18:05, 21:05, 23:05 HKT
  workflow_dispatch:
    inputs:
      scheduled_slot:
        description: 'Original UTC slot for a fallback run (leave blank for a manual refresh)'
        type: string

permissions:
  actions: read               # audit scheduled start times
  contents: write              # commit + push the refreshed data
  pages: write                 # publish the built site
  id-token: write              # required by actions/deploy-pages

# Never let two refreshes publish at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # A queued run may start after another refresh has pushed new data.
          ref: main

      - name: Set up git identity
        run: |
          git config user.name  "Hillen League Bot"
          git config user.email "actions@users.noreply.github.com"

      # The published site is the React dashboard (react-dashboard/); start.sh
      # runs `server.py --export docs`, which needs Node to `vite build` it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: react-dashboard
        run: npm ci

      - name: Restore source HTML cache
        uses: actions/cache@v4
        with:
          path: cache
          key: league-html-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: league-html-${{ runner.os }}-

      - name: Report schedule delay
        if: github.event_name == 'schedule'
        env:
          REFRESH_CRON: ${{ github.event.schedule }}
        run: python3 scripts/check_refresh_schedule.py

      - name: Audit the last seven days of scheduled starts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_refresh_schedule.py --audit

      - name: Test refresh and export regressions
        run: |
          python3 -m unittest discover -s tests
          node --test refresh-scheduler/worker.test.mjs

      - name: Refresh, validate and rebuild the site
        id: refresh
        run: ./start.sh

      - name: Record successful source check
        if: ${{ !cancelled() && steps.refresh.outputs.checked_at != '' }}
        run: |
          {
            echo "Successful source check: ${{ steps.refresh.outputs.checked_at }}"
            echo "Data changed: ${{ steps.refresh.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Pages recovery instructions
        if: steps.refresh.outcome == 'success' && steps.refresh.outputs.changed == 'true'
        run: |
          echo 'If Pages publication fails, run **Deploy site** on `main` to publish the committed database.' >> "$GITHUB_STEP_SUMMARY"

      # start.sh rebuilt docs/ in the step above; publish exactly that. There is
      # nothing to commit for it — docs/ is generated, not source.
      - name: Upload the built site
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-actions
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
